# Builds the console image. The build context is the repository root, because
# the image needs three things from three places: console/ for the app,
# index.html from the root for the site, and inbox-agent/agent/overlay.py so
# the console validates settings exactly as the job will read them.
#
#   gcloud builds submit --config console/cloudbuild.yaml \
#     --substitutions=_IMAGE=<full image ref> .

steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-f", "console/Dockerfile", "-t", "${_IMAGE}", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "${_IMAGE}"]

images:
  - "${_IMAGE}"

options:
  logging: CLOUD_LOGGING_ONLY
